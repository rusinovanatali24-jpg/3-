<style>
  :root{
    --bg-deep:#150F23;
    --bg-panel:#1F1730;
    --bg-panel-2:#251C3A;
    --line:#3A2E52;
    --gold:#E8B75B;
    --gold-dim:#B98F3F;
    --text:#F3EEE3;
    --muted:#B0A0C9;
    --ruby:#E43F5A;
    --sapphire:#2F80ED;
    --emerald:#27AE60;
    --topaz:#F2C94C;
    --amethyst:#9B51E0;
    --amber:#F2994A;
    --aqua:#56CCF2;
    --danger:#E43F5A;
    --ok:#27AE60;
  }
  *{box-sizing:border-box;}
  button,input,textarea,select,.tab,.gem-card,.drag-handle,.opt-row,.qitem{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg-deep);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.3px;margin:0 0 8px;}
  .app{display:flex;min-height:100vh;}
  .side{width:230px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px;}
  .side-footer{padding:14px 10px 4px;font-size:11px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line);text-align:center;}
  .save-box{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);}
  .save-status{font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:8px;}
  .save-status.warn{color:var(--danger);}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
  .gemicon{width:22px;height:22px;background:linear-gradient(135deg,var(--gold),var(--amber));clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);flex-shrink:0;}
  .brand b{font-family:Georgia,serif;font-size:15px;}
  .brand span{display:block;font-size:11px;color:var(--muted);}
  .tab{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:14px;border:1px solid transparent;user-select:none;}
  .tab:hover{background:var(--bg-panel-2);color:var(--text);}
  .tab.active{background:var(--bg-panel-2);color:var(--gold);border-color:var(--line);font-weight:600;}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.6;flex-shrink:0;}
  .main{flex:1;padding:26px 34px;overflow-y:auto;max-height:100vh;}
  .panel{max-width:920px;margin:0 auto;}
  .panel-head{margin-bottom:20px;}
  .panel-head p{color:var(--muted);font-size:14px;margin:4px 0 0;}
  .card{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .card h3{font-size:15px;color:var(--gold);}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .col{display:flex;flex-direction:column;gap:6px;}
  label.f{font-size:12px;color:var(--muted);margin-bottom:2px;}
  input[type=text],input[type=number],input[type=url],textarea,select{
    background:var(--bg-deep);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;
  }
  input[type=text]:focus,input[type=number]:focus,input[type=url]:focus,textarea:focus,select:focus{border-color:var(--gold-dim);}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7;}
  textarea{resize:vertical;min-height:54px;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;background:var(--bg-panel-2);color:var(--text);border:1px solid var(--line);transition:.15s;}
  button:hover{border-color:var(--gold-dim);}
  button.primary{background:linear-gradient(135deg,var(--gold),var(--amber));color:#20140A;border:none;}
  button.primary:hover{filter:brightness(1.08);}
  button.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  button.danger:hover{background:rgba(228,63,90,.12);}
  button.ghost{background:transparent;}
  button.small{padding:6px 10px;font-size:12px;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .swatch{width:100%;aspect-ratio:1/1;border-radius:10px;position:relative;overflow:hidden;background-size:cover;background-position:center;}
  .gem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;}
  .gem-card{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;}
  .gem-card .swatch{width:78px;height:78px;margin:0 auto 8px;position:relative;overflow:visible;background:none;}
  .gem3d{position:relative;width:100%;height:100%;}
  .gem3d .g3-aura{position:absolute;inset:-26%;border-radius:50%;filter:blur(8px);opacity:.6;pointer-events:none;}
  .gem3d .g3-outer{position:absolute;inset:0;clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);background-size:cover;background-position:center;}
  .gem3d .g3-inner{position:absolute;inset:13%;clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);background-size:cover;background-position:center;}
  .gem3d .g3-shine{position:absolute;width:36%;height:26%;top:16%;left:19%;border-radius:50%;transform:rotate(-16deg);pointer-events:none;}
  .gem3d .g3-spark{position:absolute;clip-path:polygon(50% 0%,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0% 50%,37% 37%);pointer-events:none;}
  .gem3d .g3-spark.s1{width:11px;height:11px;top:-4%;left:-8%;}
  .gem3d .g3-spark.s2{width:8px;height:8px;top:6%;right:-10%;}
  .gem3d .g3-spark.s3{width:7px;height:7px;bottom:2%;left:-10%;}
  @keyframes gtwinkle{0%,100%{opacity:.35;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
  .gem3d .g3-spark{animation:gtwinkle 1.8s ease-in-out infinite;}
  .gem3d .g3-spark.s2{animation-delay:.5s;}
  .gem3d .g3-spark.s3{animation-delay:1s;}
  .gem-card .name{font-size:12.5px;margin-bottom:6px;}
  .gem-card.disabled{opacity:.4;}
  .file-drop{border:1.5px dashed var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--muted);text-align:center;cursor:pointer;}
  .file-drop:hover{border-color:var(--gold-dim);color:var(--text);}
  .bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .bg-opt{border-radius:12px;height:90px;border:2px solid var(--line);cursor:pointer;position:relative;overflow:hidden;background-size:cover;background-position:center;}
  .bg-opt.selected{border-color:var(--gold);}
  .bg-opt span{position:absolute;bottom:6px;left:8px;font-size:11px;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:6px;}
  .qlist{display:flex;flex-direction:column;gap:10px;}
  .qitem{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .qitem-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .qitem-head .qtype-badge{flex:1;}
  .drag-handle{cursor:grab;color:var(--muted);font-size:14px;letter-spacing:-2px;padding:2px 4px;user-select:none;}
  .drag-handle:active{cursor:grabbing;}
  .qitem.dragging{opacity:.4;}
  .qitem.drag-over{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .qtype-badge{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg-deep);color:var(--gold);border:1px solid var(--line);}
  .opt-row{display:flex;align-items:center;gap:8px;background:var(--bg-deep);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;}
  .opt-row input[type=text]{flex:1;border:none;background:transparent;padding:2px;}
  .opt-row img{width:30px;height:30px;object-fit:cover;border-radius:6px;}
  .thumb-btn{width:30px;height:30px;border-radius:6px;background:var(--bg-panel);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);flex-shrink:0;cursor:pointer;}
  .muted{color:var(--muted);font-size:12.5px;}
  .hint{font-size:12px;color:var(--muted);margin-top:4px;}
  .footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .range-row{display:flex;align-items:center;gap:10px;}
  .range-row input[type=range]{flex:1;}
  .badge-num{background:var(--bg-deep);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;min-width:34px;text-align:center;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg-panel-2);border:1px solid var(--gold-dim);color:var(--text);padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;}
  .pick-overlay{position:fixed;inset:0;background:rgba(8,5,15,.72);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .pick-box{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .pick-box h3{color:var(--gold);font-size:16px;margin-bottom:16px;}
  .latex-toggle-btn{position:fixed;right:0;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;background:linear-gradient(135deg,var(--gold),var(--amber));color:#20140A;border:none;padding:14px 8px;border-radius:10px 0 0 10px;font-weight:700;font-size:13px;cursor:pointer;z-index:900;box-shadow:-4px 0 14px rgba(0,0,0,.3);}
  .latex-panel{position:fixed;top:0;right:-380px;width:360px;max-width:92vw;height:100vh;background:var(--bg-panel);border-left:1px solid var(--line);z-index:950;transition:right .25s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.4);}
  .latex-panel.open{right:0;}
  .latex-panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .latex-panel-head h3{color:var(--gold);font-size:15px;}
  .latex-panel-close{background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;}
  .latex-compose{padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .latex-compose textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:13px;margin-bottom:8px;}
  .latex-compose-row{display:flex;align-items:center;gap:8px;}
  .latex-compose-preview{flex:1;background:var(--bg-deep);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:32px;display:flex;align-items:center;color:var(--text);overflow-x:auto;}
  .latex-scroll{flex:1;overflow-y:auto;padding:12px 18px;}
  .latex-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 8px;}
  .latex-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .latex-card{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:center;}
  .latex-card:hover{border-color:var(--gold-dim);}
  .latex-card-render{min-height:24px;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:13px;margin-bottom:4px;overflow:hidden;}
  .latex-card-desc{font-size:10.5px;color:var(--muted);}
  .latex-field-preview{background:var(--bg-deep);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:13px;color:var(--text);min-height:20px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .preview-wrap{background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto;}
  .preview-wrap iframe{width:100%;height:70vh;min-height:400px;border:1px solid var(--line);border-radius:14px;background:#000;}
  .export-code{background:var(--bg-deep);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted);max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all;}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--muted);}
  .stat b{color:var(--text);display:block;font-size:16px;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
  select{appearance:none;}
  @media(max-width:820px){
    .app{flex-direction:column;}
    .side{width:100%;flex-direction:row;overflow-x:auto;}
  }
</style>

<div class="app">
  <div class="side">
    <div class="brand"><div class="gemicon"></div><div><b>Сокровища пустыни</b><span>редактор игры «3 в ряд»</span></div></div>
    <div class="tab active" data-tab="bg"><span class="dot"></span>Визуал</div>
    <div class="tab" data-tab="gems"><span class="dot"></span>Кристаллы</div>
    <div class="tab" data-tab="rules"><span class="dot"></span>Правила игры</div>
    <div class="tab" data-tab="questions"><span class="dot"></span>Вопросы</div>
    <div class="tab" data-tab="preview"><span class="dot"></span>Предпросмотр</div>
    <div class="tab" data-tab="export"><span class="dot"></span>Экспорт</div>
    <div class="save-box">
      <div class="save-status" id="saveStatus">Автосохранение включено</div>
      <button class="small" id="saveFileBtn" style="width:100%;margin-bottom:6px;">💾 Сохранить в файл</button>
      <button class="small ghost" id="loadFileBtn" style="width:100%;">📂 Загрузить из файла</button>
      <input type="file" id="loadFileInput" accept=".json" style="display:none">
    </div>
    <div class="side-footer">© Ситникова Наталья<br>Мастерская репетитора</div>
  </div>
  <div class="main"><div class="panel" id="panelRoot"></div></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="hiddenFile" accept="image/*" style="display:none">
<div class="pick-overlay" id="pickModal" style="display:none">
  <div class="pick-box">
    <h3>Добавить изображение</h3>
    <div class="row" id="pickChoiceRow" style="gap:10px;">
      <button class="primary" data-pick="url" style="flex:1;">🔗 По ссылке</button>
      <button data-pick="file" style="flex:1;">💻 С компьютера</button>
    </div>
    <div id="pickUrlRow" style="display:none;">
      <label class="f">Ссылка на изображение</label>
      <input type="url" id="pickUrlInput" placeholder="https://example.com/image.jpg" style="width:100%;margin:6px 0 12px;">
      <div class="row" style="gap:8px;">
        <button class="primary" id="pickUrlSubmit" style="flex:1;">Добавить</button>
        <button class="ghost" id="pickUrlBack">Назад</button>
      </div>
    </div>
    <button class="ghost" id="pickModalClose" style="width:100%;margin-top:12px;">Отмена</button>
  </div>
</div>
<div class="pick-overlay" id="addQModal" style="display:none">
  <div class="pick-box">
    <h3>Тип вопроса</h3>
    <div class="col" style="gap:8px;">
      <button data-addq="single">Один вариант ответа</button>
      <button data-addq="multiple">Несколько вариантов ответа</button>
      <button data-addq="text">Вписать ответ</button>
      <button data-addq="order">Расставить по порядку</button>
      <button data-addq="info">Без ответа (информация)</button>

    <label class="f">Свой код (можно проверить перед вставкой)</label>

      <span class="muted">Превью:</span>
      <div id="latexComposePreview" class="latex-compose-preview"></div>

  </div>
  <div class="latex-scroll" id="latexCardScroll"></div>
</div>
<script>
/* ===================== ОБЩИЕ УТИЛИТЫ ===================== */
function uid(){ return Math.random().toString(36).slice(2,9); }
function hexToRgb(hex){ hex=String(hex||'#888888').replace('#',''); if(hex.length===3) hex=hex.split('').map(function(c){return c+c;}).join(''); const num=parseInt(hex,16)||0x888888; return {r:(num>>16)&255,g:(num>>8)&255,b:num&255}; }
function rgbToHex(r,g,b){ function h(v){ v=Math.max(0,Math.min(255,Math.round(v))); const s=v.toString(16); return s.length<2?'0'+s:s; } return '#'+h(r)+h(g)+h(b); }
function shade(hex, percent){
  const c=hexToRgb(hex); const t = percent<0?0:255; const p=Math.abs(percent)/100;
  return rgbToHex(c.r+(t-c.r)*p, c.g+(t-c.g)*p, c.b+(t-c.b)*p);
}
function rgba(hex, a){ const c=hexToRgb(hex); return 'rgba('+c.r+','+c.g+','+c.b+','+a+')'; }
// Рисует огранённый кристалл: пять граней разной яркости + верхняя площадка + блик (SVG)
function facetSVG(base){
  const fTable = shade(base, 42), fTopLeft = shade(base, 16), fTopRight = shade(base, 0),
        fRight = shade(base, -18), fLeftBottom = shade(base, -28), fBottom = shade(base, -44),
        edge = shade(base, -62);
  const P0='50,2', P1='97,37', P2='80,97', P3='20,97', P4='3,37';
  const I0='45,17', I1='66,33', I2='58,57', I3='33,57', I4='25,33';
  return ''+
  '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block;overflow:visible;">'+
    '<polygon points="'+P4+' '+P0+' '+I0+' '+I4+'" fill="'+fTopLeft+'"/>'+
    '<polygon points="'+P0+' '+P1+' '+I1+' '+I0+'" fill="'+fTopRight+'"/>'+
    '<polygon points="'+P1+' '+P2+' '+I2+' '+I1+'" fill="'+fRight+'"/>'+
    '<polygon points="'+P3+' '+P4+' '+I4+' '+I3+'" fill="'+fLeftBottom+'"/>'+
    '<polygon points="'+P2+' '+P3+' '+I3+' '+I2+'" fill="'+fBottom+'"/>'+
    '<polygon points="'+I0+' '+I1+' '+I2+' '+I3+' '+I4+'" fill="'+fTable+'"/>'+
    '<polygon points="'+P0+' '+P1+' '+P2+' '+P3+' '+P4+'" fill="none" stroke="'+edge+'" stroke-width="1.6" stroke-opacity=".55"/>'+
    '<polygon points="'+I0+' '+I1+' '+I2+' '+I3+' '+I4+'" fill="none" stroke="'+edge+'" stroke-width=".8" stroke-opacity=".4"/>'+
    '<line x1="30" y1="72" x2="54" y2="88" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".16"/>'+
    '<line x1="72" y1="55" x2="82" y2="80" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".1"/>'+
    '<ellipse cx="40" cy="27" rx="15" ry="9" fill="#fff" opacity=".55" transform="rotate(-18 40 27)"/>'+
    '<circle cx="32" cy="19" r="2.6" fill="#fff" opacity=".92"/>'+
  '</svg>';
}
// Строит объёмный кристалл: если есть фото (шаблон или своё) — используем его как есть (с мягким растворением краёв),
// иначе рисуем SVG-огранку с собственной подсветкой и искрами
function gemVisualHTML(gem, opts){
  opts = opts || {};
  const effSrc = gem.src || gem.templateSrc || null;
  const base = gem.color || '#E8B75B';
  const lighter = shade(base, 78);
  const withAura = (opts.aura!==false) && !effSrc;
  const withSpark = !!opts.spark && !effSrc;
  let body;
  if(effSrc){
    const mask = 'radial-gradient(circle at 50% 50%, #000 84%, rgba(0,0,0,.55) 93%, transparent 100%)';
    body = '<div style="position:absolute;inset:0;background-image:url(\''+effSrc+'\');background-size:cover;background-position:center;'+
      '-webkit-mask-image:'+mask+';mask-image:'+mask+';"></div>';
  } else {
    body = '<div style="position:absolute;inset:0;">'+facetSVG(base)+'</div>';
  }
  return ''+
  '<div class="gem3d">'+
    (withAura?('<div class="g3-aura" style="background:radial-gradient(circle,'+rgba(base,.55)+' 0%, transparent 72%);"></div>'):'')+
    body+
    (withSpark?(
      '<div class="g3-spark s1" style="background:'+rgba(lighter,.95)+';"></div>'+
      '<div class="g3-spark s2" style="background:'+rgba(lighter,.9)+';"></div>'+
      '<div class="g3-spark s3" style="background:'+rgba(lighter,.85)+';"></div>'
    ):'')+
  '</div>';
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h); showToast._h=setTimeout(()=>t.classList.remove('show'),2200);

function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Экранирование именно для атрибута srcdoc — как в «Карта сокровищ» (только & и "), чтобы код совпадал с проверенно рабочим форматом
function escSrcdoc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function escHtml(s){ return escAttr(s); }

// Надёжное копирование в буфер обмена (важно для больших строк — простой writeText иногда молча
// обрезает/не срабатывает на больших объёмах). Порядок: ClipboardItem+Blob -> writeText -> execCommand.
function robustCopy(text, onSuccess, onFail){
  function fallbackExecCommand(){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;width:1px;height:1px;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if(ok) onSuccess(); else onFail();
  }
  try{
    if(navigator.clipboard && window.ClipboardItem){
      const blob = new Blob([text], {type:'text/plain'});
      navigator.clipboard.write([new ClipboardItem({'text/plain':blob})]).then(onSuccess).catch(function(){
        if(navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(onSuccess).catch(fallbackExecCommand);
        else fallbackExecCommand();
      });
    } else if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(onSuccess).catch(fallbackExecCommand);
    } else {
      fallbackExecCommand();
    }
  }catch(e){ fallbackExecCommand(); }
}

// Сжатие изображения через canvas. Возвращает Promise<dataURL>
function compressImage(source, maxDim, quality){
  maxDim = maxDim || 300; quality = quality || 0.72;
  return new Promise(function(resolve,reject){
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      try{
        let w=img.naturalWidth, h=img.naturalHeight;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        const dataUrl = c.toDataURL('image/webp', quality);
        // fallback если webp не дал сжатия (некоторые браузеры возвращают png молча)
        if(dataUrl.indexOf('data:image/webp')===0){ resolve(dataUrl); }
        else { resolve(c.toDataURL('image/jpeg', quality)); }
      }catch(e){ reject(e); }
    };
    img.onerror = function(){ reject(new Error('load-failed')); };
    img.src = source;
  });
}
function fileToDataURL(file){
  return new Promise(function(resolve,reject){
    const r=new FileReader();
    r.onload=function(){ resolve(r.result); };
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
// Пытаемся сжать по URL; если помешает CORS — используем исходный URL напрямую.
async function compressFromURL(url, maxDim, quality){
  try{ return await compressImage(url, maxDim, quality); }
  catch(e){ return url; }
}
async function compressFromFile(file, maxDim, quality){
  const durl = await fileToDataURL(file);
  try{ return await compressImage(durl, maxDim, quality); }
  catch(e){ return durl; }
}

/* Универсальный picker: открывает модалку "по ссылке" или "с компьютера" и возвращает dataURL/url через колбэк */
function pickImage(onDone, opts){
  opts = opts || {};
  const maxDim = opts.maxDim || 300, quality = opts.quality || 0.72;
  const modal = document.getElementById('pickModal');
  const choiceRow = document.getElementById('pickChoiceRow');
  const urlRow = document.getElementById('pickUrlRow');
  const urlInput = document.getElementById('pickUrlInput');

  function close(){ modal.style.display='none'; urlRow.style.display='none'; choiceRow.style.display='flex'; urlInput.value=''; }

  modal.style.display='flex';
  choiceRow.style.display='flex';
  urlRow.style.display='none';

  document.getElementById('pickModalClose').onclick = close;
  document.getElementById('pickUrlBack').onclick = function(){ urlRow.style.display='none'; choiceRow.style.display='flex'; };

  choiceRow.querySelector('[data-pick="url"]').onclick = function(){
    choiceRow.style.display='none';
    urlRow.style.display='block';
    urlInput.value='';
    urlInput.focus();
  };
  choiceRow.querySelector('[data-pick="file"]').onclick = function(){
    close();
    const inp = document.getElementById('hiddenFile');
    inp.value='';
    inp.onchange = function(){
      const f = inp.files[0]; if(!f) return;
      showToast('Сжимаю изображение…');
      compressFromFile(f, maxDim, quality).then(function(res){ onDone(res); showToast('Изображение добавлено'); })
        .catch(function(){ showToast('Не удалось обработать файл'); });
    };
    inp.click();
  };

  function submitUrl(){
    const url = urlInput.value.trim();
    if(!url) { urlInput.focus(); return; }
    close();
    showToast('Загружаю и сжимаю изображение…');
    compressFromURL(url, maxDim, quality).then(function(res){ onDone(res); showToast('Изображение добавлено'); })
      .catch(function(){ showToast('Не удалось загрузить изображение'); });
  }
  document.getElementById('pickUrlSubmit').onclick = submitUrl;
  urlInput.onkeydown = function(e){ if(e.key==='Enter') submitUrl(); };
}

/* ===================== СОХРАНЕНИЕ ПРОЕКТА ===================== */
const SAVE_KEY = 'match3_editor_project_v1';
function serializeStateForSave(){
  return {
    background: state.background,
    gems: state.gems.map(function(g){ return {id:g.id, src:g.src, enabled:g.enabled}; }),
    grid: state.grid,
    cellSize: state.grid.cellSize,
    targetGemId: state.targetGemId,
    targetCount: state.targetCount,
    wrongPenalty: state.wrongPenalty,
    feedback: state.feedback,
    targetReachedMessage: state.targetReachedMessage,
    questions: state.questions,
    modal: state.modal,
    grid: state.grid,
    cellSize: state.grid.cellSize,
    author: state.author,
    savedAt: Date.now()
  };
}
function restoreFromSaved(saved){
  if(!saved) return;
  if(saved.background) state.background = saved.background;
  if(saved.grid) state.grid = saved.grid;
  if(saved.cellSize!=null) state.grid.cellSize = saved.cellSize;
  if(saved.targetGemId) state.targetGemId = saved.targetGemId;
  if(saved.targetCount!=null) state.targetCount = saved.targetCount;
  if(saved.wrongPenalty!=null) state.wrongPenalty = saved.wrongPenalty;
  if(saved.feedback) state.feedback = saved.feedback;
  if(saved.targetReachedMessage!=null) state.targetReachedMessage = saved.targetReachedMessage;
  if(saved.questions) state.questions = saved.questions;
  if(saved.modal) state.modal = Object.assign(state.modal, saved.modal);
  if(saved.grid && saved.grid.cellSize!=null) state.grid.cellSize = saved.grid.cellSize;
  if(saved.author) state.author = saved.author;
  if(saved.gems){
    saved.gems.forEach(function(sg){
      const g = state.gems.find(function(x){ return x.id===sg.id; });
      if(g){ g.src = sg.src; g.enabled = sg.enabled; }
    });
  }
}
let autosaveTimer = null;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(function(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify(serializeStateForSave()));
      setSaveStatus('Сохранено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}), false);
    }catch(e){
      setSaveStatus('Не удалось автосохранить — сохраните в файл вручную', true);
    }
  }, 900);
}
function setSaveStatus(text, warn){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = text;
  el.className = 'save-status'+(warn?' warn':'');
}
function tryRestoreOnLoad(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      restoreFromSaved(JSON.parse(raw));
      showToast('Восстановлен предыдущий проект');
      setSaveStatus('Восстановлено из автосохранения', false);
    }
  }catch(e){}
}

function bgPreviewStyle(){
  if(state.background.type==='template') return 'background:'+BG_TEMPLATES[state.background.templateId].css+';';
  if(state.background.src) return 'background-image:url(\''+state.background.src+'\');background-size:cover;background-position:center;';
  return 'background:#000;';
}
function renderBgPanel(){
  let tiles='';
  Object.keys(BG_TEMPLATES).forEach(function(key){
    const t=BG_TEMPLATES[key];
    const sel = (state.background.type==='template' && state.background.templateId===key) ? ' selected' : '';
    tiles += '<div class="bg-opt'+sel+'" data-action="pick-bg-template" data-key="'+key+'" style="background:'+t.css+'"><span>'+t.name+'</span></div>';
  });
  const customSel = state.background.type==='custom' ? ' selected' : '';
  tiles += '<div class="bg-opt'+customSel+'" data-action="pick-bg-custom" style="'+(state.background.type==='custom'&&state.background.src?('background-image:url(\''+state.background.src+'\');background-size:cover;background-position:center;'):'display:flex;align-items:center;justify-content:center;border-style:dashed;')+'">'+(state.background.type==='custom'&&state.background.src?'':'<span style="position:static;background:none;">+ своё изображение</span>')+(state.background.type==='custom'&&state.background.src?'<span>Своё изображение</span>':'')+'</div>';

  const m = state.modal;
  const styleButtons = MODAL_STYLES.map(function(s){
    return '<button class="'+(m.style===s.id?'primary':'')+'" data-action="set-modal-style" data-style="'+s.id+'">'+s.name+'</button>';
  }).join('');
  const fontOptions = FONT_OPTIONS.map(function(f){
    return '<option value="'+f.id+'" '+(m.font===f.id?'selected':'')+'>'+f.name+'</option>';
  }).join('');

  return ''+
  '<div class="panel-head"><h2>Визуал</h2><p>Фон игры и оформление всплывающего окна с вопросом.</p></div>'+
  '<div class="card"><h3>Пейзаж</h3><div class="bg-grid">'+tiles+'</div>'+
  (state.background.type==='custom' ? '<div class="hint">Изображение сжимается автоматически, чтобы файл игры оставался лёгким.</div>' : '')+
  '</div>'+
  '<div class="card"><h3>Предпросмотр фона</h3><div class="swatch" style="height:160px;'+bgPreviewStyle()+'"></div></div>'+

  '<div class="card"><h3>Всплывающее окно вопроса</h3>'+
  '<label class="f">Стиль оформления</label><div class="row" style="gap:8px;margin:6px 0 16px;">'+styleButtons+'</div>'+
  '<div class="row" style="gap:16px;align-items:flex-end;margin-bottom:16px;">'+
    '<div class="col"><label class="f">Акцентный цвет (рамка + кнопка ответа)</label><input type="color" data-action="set-modal-color" value="'+escAttr(m.color)+'" style="width:56px;height:36px;padding:2px;"></div>'+
    '<div class="col" style="flex:1;min-width:180px;"><label class="f">Шрифт</label><select data-action="set-modal-font">'+fontOptions+'</select></div>'+
  '</div>'+
  '<div class="col" style="margin-bottom:16px;"><label class="f">Размер шрифта вопроса: <b id="modalFontSizeLabel">'+m.fontSize+'px</b></label>'+
  '<input type="range" min="13" max="28" value="'+m.fontSize+'" data-action="set-modal-fontsize" style="width:100%;"></div>'+
  '<div class="col" style="margin-bottom:16px;"><label class="f">Ширина окна вопроса: <b id="modalMaxWidthLabel">'+(m.maxWidth||420)+'px</b></label>'+
  '<input type="range" min="280" max="600" step="10" value="'+(m.maxWidth||420)+'" data-action="set-modal-maxwidth" style="width:100%;"></div>'+
  '<label class="f">Фоновая подложка окна (необязательно)</label>'+
  '<div class="row" style="gap:10px;align-items:center;margin:6px 0 16px;">'+
    '<div class="swatch" style="width:96px;height:64px;flex-shrink:0;'+(m.bgImage?('background-image:url(\''+m.bgImage+'\');background-size:cover;background-position:center;'):'background:var(--bg-deep);')+'"></div>'+
    '<button class="small" data-action="modal-bg-upload">Своё изображение</button>'+
    (m.bgImage?'<button class="small ghost" data-action="modal-bg-reset">Сброс</button>':'')+
  '</div>'+
  '<label class="f">Живой пример</label>'+
  '<div id="modalPreviewBox" style="background:#150F23;border-radius:12px;padding:20px;display:flex;justify-content:center;">'+modalPreviewHTML()+'</div>'+
  '</div>';
}

function modalPreviewHTML(){
  const m = state.modal;
  const font = (FONT_OPTIONS.find(f=>f.id===m.font)||FONT_OPTIONS[0]).family;
  let boxStyle = 'width:100%;max-width:'+(m.maxWidth||420)+'px;border-radius:16px;padding:18px;color:#F3EEE3;font-family:'+font+';position:relative;overflow:hidden;';
  let headStyle = 'margin:0 0 10px;font-size:'+m.fontSize+'px;line-height:1.4;position:relative;font-family:'+font+';font-weight:400;';
  if(m.style==='3d'){
    boxStyle += 'background:linear-gradient(160deg,#2b2040,#1a1228);border:3px solid '+m.color+';box-shadow:0 8px 0 '+shade(m.color,-40)+',0 16px 26px rgba(0,0,0,.55);';
  } else if(m.style==='neon'){
    boxStyle += 'background:#0d0a17;border:2px solid '+m.color+';box-shadow:0 0 10px '+m.color+',0 0 28px '+rgba(m.color,.5)+',inset 0 0 20px '+rgba(m.color,.12)+';';
  } else {
    boxStyle += 'background:#211732;border:1px solid #3a2e52;box-shadow:0 14px 30px rgba(0,0,0,.4);';
  }
  const bgLayer = m.bgImage ? '<div style="position:absolute;inset:0;background-image:url(\''+m.bgImage+'\');background-size:cover;background-position:center;opacity:.35;"></div>' : '';
  return '<div style="'+boxStyle+'">'+bgLayer+
    '<h3 style="'+headStyle+'">Сколько будет 2 + 2?</h3>'+
    '<div style="position:relative;display:flex;flex-direction:column;gap:8px;">'+
      '<div style="background:rgba(21,15,35,.7);border:1px solid #3a2e52;border-radius:10px;padding:9px 12px;font-size:'+(m.fontSize-2)+'px;">3</div>'+
      '<div style="background:rgba(21,15,35,.7);border:1px solid '+m.color+';border-radius:10px;padding:9px 12px;font-size:'+(m.fontSize-2)+'px;">4</div>'+
      '<button style="width:100%;margin-top:4px;padding:10px;border-radius:10px;border:none;background:linear-gradient(135deg,'+m.color+','+shade(m.color,-25)+');color:#20140A;font-weight:700;font-size:'+(m.fontSize-2)+'px;">Ответить</button>'+
    '</div>'+
  '</div>';
}


/* ===================== ПАНЕЛЬ: КРИСТАЛЛЫ ===================== */
function renderGemsPanel(){
  const enabledCount = state.gems.filter(g=>g.enabled).length;
  let cards = state.gems.map(function(g,i){
    return '<div class="gem-card'+(g.enabled?'':' disabled')+'">'+
      '<div class="swatch">'+gemVisualHTML(g,{aura:true,spark:true})+'</div>'+
      '<div class="name">'+escHtml(g.name)+'</div>'+
      '<div class="row" style="justify-content:center;gap:6px;margin-bottom:6px;">'+
        '<button class="small" data-action="gem-upload" data-i="'+i+'">Своё фото</button>'+
        (g.src?'<button class="small ghost" data-action="gem-reset" data-i="'+i+'">Сброс</button>':'')+
      '</div>'+
      '<label class="row" style="justify-content:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;">'+
        '<input type="checkbox" data-action="gem-toggle" data-i="'+i+'" '+(g.enabled?'checked':'')+(g.enabled&&enabledCount<=4?' disabled':'')+'> в игре'+
      '</label>'+
    '</div>';
  }).join('');
  return ''+
  '<div class="panel-head"><h2>Набор кристаллов</h2><p>Встроенные шаблоны кристаллов — можно заменить своим изображением по ссылке или с компьютера. В игре должно участвовать от 4 до 7 видов.</p></div>'+
  '<div class="card"><div class="gem-grid">'+cards+'</div><div class="hint">Сейчас в игре: '+enabledCount+' вид(ов) кристаллов.</div></div>';
}

/* ===================== ПАНЕЛЬ: ПРАВИЛА ИГРЫ ===================== */

  {id:'confetti', name:'Конфетти'},
  {id:'fireworks', name:'Фейерверк'},
  {id:'stars', name:'Звёздный салют'}
];
function renderRulesPanel(){
  const enabledGems = state.gems.filter(g=>g.enabled);
  const gemOptions = enabledGems.map(g=>'<option value="'+g.id+'" '+(g.id===state.targetGemId?'selected':'')+'>'+escHtml(g.name)+'</option>').join('');
  const fbOptions = FEEDBACK_OPTIONS.map(f=>'<option value="'+f.id+'" '+(f.id===state.feedback?'selected':'')+'>'+f.name+'</option>').join('');
  return ''+
  '<div class="panel-head"><h2>Правила игры</h2><p>Настройте размер поля, целевой кристалл и штраф за неверный ответ.</p></div>'+
  '<div class="card"><h3>Игровое поле</h3><div class="row">'+
    '<div class="col"><label class="f">Строк</label><input type="number" min="5" max="10" value="'+state.grid.rows+'" data-action="set-rows" style="width:90px;"></div>'+
    '<div class="col"><label class="f">Столбцов</label><input type="number" min="5" max="10" value="'+state.grid.cols+'" data-action="set-cols" style="width:90px;"></div>'+
  '</div></div>'+
  '<div class="card"><h3>Цель: собрать кристаллы</h3><div class="row">'+
    '<div class="col"><label class="f">Целевой кристалл</label><select data-action="set-target-gem">'+gemOptions+'</select></div>'+
    '<div class="col"><label class="f">Сколько собрать</label><input type="number" min="1" max="99" value="'+state.targetCount+'" data-action="set-target-count" style="width:90px;"></div>'+
    '<div class="col"><label class="f">Штраф за неверный ответ (+ к цели)</label><input type="number" min="0" max="20" value="'+state.wrongPenalty+'" data-action="set-penalty" style="width:90px;"></div>'+
  '</div><div class="hint">Если ребёнок собирает 3+ целевых кристалла в ряд — прогресс растёт и запускается эффект. Если в ряд собираются кристаллы другого цвета — открывается задание. Неверный ответ увеличивает цель на указанное число.</div></div>'+
  '<div class="card"><h3>Эффект за успех</h3><div class="row"><select data-action="set-feedback">'+fbOptions+'</select></div></div>'+
  '<div class="card"><h3>Сообщение при достижении цели</h3>'+
  '<label class="f">Текст уведомления, когда кристаллы собраны, но задания ещё не закончились</label>'+
  '<textarea data-action="set-target-msg" placeholder="Например: Кристаллы собраны! Осталось увидеть ещё не все задания…" style="width:100%;margin-top:6px;">'+escHtml(state.targetReachedMessage)+'</textarea>'+
  '<div class="hint">Это сообщение появится в виде всплывающей подсказки, когда ребёнок соберёт нужное количество кристаллов, но ещё не ответит на все вопросы.</div></div>';
}

/* ===================== ПАНЕЛЬ: ВОПРОСЫ ===================== */
const QTYPE_LABEL = {single:'Один вариант', multiple:'Несколько вариантов', text:'Ввести ответ', order:'Расставить по порядку', info:'Без ответа (информация)'};
function newQuestion(type){
  const q = { id:uid(), type:type, text:'', image:null };
  if(type==='single'||type==='multiple'){
    q.options=[{id:uid(),text:'',image:null,correct:true},{id:uid(),text:'',image:null,correct:false}];
  } else if(type==='text'){
    q.answers='';
  } else if(type==='order'){
    q.items=[{id:uid(),text:'',image:null},{id:uid(),text:'',image:null},{id:uid(),text:'',image:null}];
  }
  return q;
}
function qThumb(src, dataAction, dataQ, dataExtra){
  return '<div class="thumb-btn" data-action="'+dataAction+'" data-q="'+dataQ+'"'+(dataExtra||'')+' title="Добавить изображение" style="'+(src?('background-image:url(\''+src+'\');background-size:cover;'):'')+'">'+(src?'':'🖼')+'</div>';
}
function renderQuestionsPanel(){
  let list = state.questions.map(function(q,qi){
    let body='';
    body += '<div class="col" style="margin-bottom:4px;"><label class="f">Текст вопроса (формулы в $...$, например $\\frac{1}{2}$)</label><div class="row">'+
      '<textarea data-action="q-text" data-q="'+qi+'" placeholder="Введите текст вопроса…" style="flex:1;">'+escHtml(q.text)+'</textarea>'+
      qThumb(q.image,'q-image',qi)+
      (q.image?('<button class="small ghost" data-action="q-image-reset" data-q="'+qi+'">✕</button>'):'')+
    '</div>'+
    (q.text && q.text.indexOf('$')!==-1 ? '<div class="latex-field-preview" id="qLatexPreview_'+qi+'">'+escHtml(q.text)+'</div>' : '')+
    '</div>';

    if(q.type==='single'||q.type==='multiple'){
      body += '<label class="f">Варианты ответа ('+(q.type==='single'?'один правильный':'можно несколько правильных')+')</label>';
      q.options.forEach(function(o,oi){
        body += '<div class="opt-row">'+
          '<input type="'+(q.type==='single'?'radio':'checkbox')+'" '+(q.type==='single'?'name="correct-'+qi+'"':'')+' data-action="opt-correct" data-q="'+qi+'" data-o="'+oi+'" '+(o.correct?'checked':'')+'>'+
          '<input type="text" data-action="opt-text" data-q="'+qi+'" data-o="'+oi+'" placeholder="Вариант '+(oi+1)+'" value="'+escAttr(o.text)+'">'+
          (o.image?'<img src="'+o.image+'">':'')+
          qThumb(o.image,'opt-image',qi,' data-o="'+oi+'"')+
          '<button class="small ghost" data-action="opt-remove" data-q="'+qi+'" data-o="'+oi+'">✕</button>'+
        '</div>';
      });
      body += '<button class="small" data-action="opt-add" data-q="'+qi+'">+ вариант</button>';
    } else if(q.type==='text'){
      body += '<div class="col"><label class="f">Правильные ответы (через | , регистр не важен)</label><input type="text" data-action="q-answers" data-q="'+qi+'" placeholder="Например: ответ|вариант ответа|5, 10" value="'+escAttr(q.answers)+'"></div>';
    } else if(q.type==='order'){
      body += '<label class="f">Элементы в ПРАВИЛЬНОМ порядке (сверху вниз, перетаскивайте за ⠿⠿)</label>';
      q.items.forEach(function(it,ii){
        body += '<div class="opt-row order-item-row" data-qi="'+qi+'" data-oi="'+ii+'">'+
          '<span class="drag-handle" title="Перетащить">⠿⠿</span>'+
          '<span class="muted" style="width:16px;">'+(ii+1)+'.</span>'+
          '<input type="text" data-action="item-text" data-q="'+qi+'" data-o="'+ii+'" placeholder="Элемент '+(ii+1)+'" value="'+escAttr(it.text)+'">'+
          (it.image?'<img src="'+it.image+'">':'')+
          qThumb(it.image,'item-image',qi,' data-o="'+ii+'"')+
          '<button class="small ghost" data-action="item-remove" data-q="'+qi+'" data-o="'+ii+'">✕</button>'+
        '</div>';
      });
      body += '<button class="small" data-action="item-add" data-q="'+qi+'">+ элемент</button>';
    } else if(q.type==='info'){
      body += '<div class="hint">Вопрос без ответа — ребёнок просто читает информацию и нажимает «Понятно». Штраф не начисляется.</div>';
    }

    return '<div class="qitem" data-qi="'+qi+'">'+
      '<div class="qitem-head"><span class="drag-handle" title="Перетащить для изменения порядка">⠿⠿</span><span class="qtype-badge">'+(qi+1)+'. '+QTYPE_LABEL[q.type]+'</span>'+
      '<button class="small danger" data-action="q-remove" data-q="'+qi+'">Удалить</button></div>'+
      body+
    '</div>';
  }).join('');

  if(!list) list = '<p class="muted">Вопросов пока нет. Добавьте первый — он будет появляться, когда ребёнок случайно соберёт в ряд НЕ целевые кристаллы.</p>';

  const actionsRow = '<div class="row" style="margin-top:14px;gap:8px;">'+
    '<button class="primary" data-action="open-add-q">+ Добавить вопрос</button>'+
    (state.questions.length ? '<button class="danger" data-action="delete-all-q">🗑 Удалить все вопросы</button>' : '')+
  '</div>';

  return ''+
  '<div class="panel-head"><h2>Задания</h2><p>Открываются, когда ребёнок вынужденно собирает в ряд кристаллы не целевого цвета. У каждого вопроса и варианта ответа можно добавить изображение. Вопросы можно перетаскивать за значок ⠿⠿, чтобы менять порядок.</p></div>'+
  '<div class="card"><div class="qlist">'+list+'</div>'+actionsRow+'</div>';
}

/* ===================== ПАНЕЛЬ: ПРЕДПРОСМОТР ===================== */
function renderPreviewPanel(){
  const enabledCount = state.gems.filter(g=>g.enabled).length;
  if(enabledCount<2){
    return '<div class="panel-head"><h2>Предпросмотр</h2></div><div class="card"><p class="muted">Включите хотя бы 2 вида кристаллов на вкладке «Кристаллы», чтобы запустить игру.</p></div>';
  }
  return ''+
  '<div class="panel-head"><h2>Предпросмотр</h2><p>Играйте прямо здесь — так игру увидит ребёнок.</p></div>'+
  '<div class="card"><label class="f">Размер кристаллов: <b id="gemSizeLabel">'+(state.grid.cellSize||72)+'px</b></label>'+
  '<input type="range" min="40" max="120" step="4" value="'+(state.grid.cellSize||72)+'" data-action="set-gem-size" style="width:100%;margin-bottom:12px;">'+
  '<div class="hint">Потяните слайдер, чтобы увеличить или уменьшить кристаллы. Фон останется неизменным.</div></div>'+
  '<div class="preview-wrap">'+
    '<iframe id="previewFrame" srcdoc="'+escAttr(buildStandaloneHTML(state))+'"></iframe>'+
    '<button data-action="reload-preview">🔄 Перезапустить с текущими настройками</button>'+
  '</div>';
}

/* ===================== ПАНЕЛЬ: ЭКСПОРТ ===================== */
function renderExportPanel(){
  const html = buildStandaloneHTML(state);
  const sizeKb = Math.round(new Blob([html]).size/1024);
  const fullIframe = '<iframe srcdoc="'+escSrcdoc(html)+'" width="100%" height="100%" style="border:none;border-radius:10px;" allowfullscreen></iframe>';
  return ''+
  '<div class="panel-head"><h2>Экспорт готовой игры</h2><p>Скопируйте готовый код iframe и вставьте его в Genially — так же, как в «Карта сокровищ». Хостинг файла отдельно не требуется.</p></div>'+
  '<div class="card"><div class="stat-row">'+
    '<div class="stat"><b>'+sizeKb+' КБ</b>размер файла игры</div>'+
    '<div class="stat"><b>'+state.questions.length+'</b>заданий</div>'+
    '<div class="stat"><b>'+state.grid.rows+'×'+state.grid.cols+'</b>поле</div>'+
  '</div></div>'+

  '<div class="card"><h3>Скопировать код для Genially</h3>'+
  '<p class="muted">Нажмите кнопку и вставьте код в «Вставить → Внешний контент» в Genially (или в любое другое место, куда обычно вставляете код игры).</p>'+
  '<button class="primary" data-action="copy-iframe" style="margin-bottom:10px;">📋 Скопировать код для Genially</button>'+
  '<div class="export-code">'+escHtml(fullIframe.slice(0,400))+'…</div></div>'+

  '<div class="card"><h3>Скачать файл</h3><p class="muted">Отдельный HTML-файл игры — можно сохранить как есть или загрузить на свой хостинг.</p>'+
  '<button data-action="download-html">⬇ Скачать game.html</button></div>';
}

/* ===================== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ===================== */
document.querySelectorAll('.tab').forEach(function(el){
  el.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    activeTab = el.dataset.tab;
    render();
  });
});

function render(){
  const root = document.getElementById('panelRoot');
  if(activeTab==='bg') root.innerHTML = renderBgPanel();
  else if(activeTab==='gems') root.innerHTML = renderGemsPanel();
  else if(activeTab==='rules') root.innerHTML = renderRulesPanel();
  else if(activeTab==='questions') root.innerHTML = renderQuestionsPanel();
  else if(activeTab==='preview') root.innerHTML = renderPreviewPanel();
  else if(activeTab==='export') root.innerHTML = renderExportPanel();
  if(activeTab==='questions') typesetMath(root);
  scheduleAutosave();
}

.g-submit{width:100%;padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--modal-accent,#E8B75B),var(--modal-accent-dark,#F2994A));color:#20140A;font-weight:700;font-size:14.5px;cursor:pointer;}
.g-fb{margin-top:10px;text-align:center;font-weight:700;font-size:14px;min-height:20px;}
.g-fb.ok{color:#7CE0A0;}
.g-fb.bad{color:#F08398;}
.g-win{position:fixed;inset:0;background:rgba(10,6,20,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:60;text-align:center;padding:20px;}
.g-win h2{font-family:Georgia,serif;font-size:30px;margin:0 0 10px;}
.g-win button{margin-top:16px;padding:12px 22px;border-radius:12px;border:none;background:linear-gradient(135deg,#E8B75B,#F2994A);color:#20140A;font-weight:700;font-size:15px;cursor:pointer;}
.g-toast{position:absolute;top:8px;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(20,12,32,.92);color:#F3EEE3;border:1px solid #E8B75B;border-radius:10px;padding:9px 16px;font-size:13px;white-space:nowrap;opacity:0;transition:.3s;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.4);}
.g-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.g-resize-handle{position:absolute;right:-8px;bottom:-8px;width:32px;height:32px;cursor:nwse-resize;z-index:100;opacity:1;transition:opacity .2s,transform .2s;background:rgba(232,183,91,.35);border-radius:50%;border:2px solid #E8B75B;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.g-resize-handle:hover{opacity:1;background:rgba(232,183,91,.55);transform:scale(1.2);}
.g-resize-handle::after{content:'';position:absolute;right:7px;bottom:7px;width:12px;height:12px;border-right:3px solid #E8B75B;border-bottom:3px solid #E8B75B;border-radius:0 0 3px 0;}
.g-resize-label{position:absolute;right:30px;bottom:6px;background:rgba(20,12,32,.95);color:#E8B75B;padding:3px 10px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid rgba(232,183,91,.3);}
.g-resize-handle:hover .g-resize-label{opacity:1;}
.g-board-wrap{position:relative;display:inline-block;flex-shrink:0;}
`;

const GAME_ENGINE_JS = `
(function(){
  var GEMS = CONFIG.gems.filter(function(g){ return g.enabled; });
  var targetIndex = 0;
  for(var gi=0; gi<GEMS.length; gi++){ if(GEMS[gi].id===CONFIG.targetGemId) targetIndex=gi; }
  var ROWS = CONFIG.grid.rows, COLS = CONFIG.grid.cols;
  var board = [];
  var progress = 0;
  var target = CONFIG.targetCount;
  var busy = false;
  var selected = null;
  var qQueue = [];
  var askedIds = {};

  var root = document.getElementById('game-root');
  var bgCss = CONFIG.background.type==='template'
    ? { desert:'radial-gradient(circle at 30% 20%, #6b4a2d 0%, #3c2415 45%, #1c0f08 100%)', cave:'radial-gradient(circle at 50% 10%, #3a2a5c 0%, #1c1230 55%, #0c0716 100%)', space:'radial-gradient(circle at 70% 20%, #1b2a5e 0%, #0c0f2e 55%, #050614 100%)' }[CONFIG.background.templateId]
    : 'url(\\'' + CONFIG.background.src + '\\') center/cover';

  root.innerHTML =
    '<div class="g-wrap" style="background:'+bgCss+'">' +
      '<div class="g-hud"><div class="g-target-icon" id="gTargetIcon"></div>' +
      '<div class="g-progress-outer"><div class="g-progress-inner" id="gProgFill" style="width:0%"></div></div>' +
      '<div class="g-progress-text" id="gProgText"></div></div>' +
      '<div class="g-board-wrap" id="gBoardWrap"><div class="g-board-holder"><div class="g-board" id="gBoard"></div><canvas class="g-fx" id="gFx"></canvas></div><div class="g-resize-handle" id="gResizeHandle" title="Потяните, чтобы изменить размер кристаллов"><span class="g-resize-label">Тяните ↘</span></div></div>' +
    '</div>' +
    '<div class="g-modal-overlay" id="gModal" style="display:none"></div>';

  var targetIconEl = document.getElementById('gTargetIcon');
  targetIconEl.innerHTML = gemVisualHTML(GEMS[targetIndex], {aura:false, spark:false});

  var boardEl = document.getElementById('gBoard');
  boardEl.style.gridTemplateColumns = 'repeat('+COLS+', 1fr)';
  boardEl.style.gridTemplateRows = 'repeat('+ROWS+', 1fr)';
  var fx = document.getElementById('gFx');
  var fxCtx = fx.getContext('2d');

  var currentCellSize = CONFIG.grid.cellSize || 72;

  function sizeBoard(){
    var hud = document.querySelector('.g-hud');
    var hudH = hud ? hud.offsetHeight + 8 : 0;
    var availW = window.innerWidth - 20;
    var availH = window.innerHeight - hudH - 20;
    var cellW = Math.floor(availW / COLS);
    var cellH = Math.floor(availH / ROWS);
    // Используем заданный размер, но не больше доступного пространства
    var cell = Math.min(currentCellSize || 72, cellW, cellH);
    cell = Math.max(24, cell);
    boardEl.style.width = (cell*COLS)+'px';
    boardEl.style.height = (cell*ROWS)+'px';
    if(hud) hud.style.maxWidth = (cell*COLS)+'px';
    document.documentElement.style.setProperty('--cell', cell+'px');
    fx.width = boardEl.offsetWidth + 16; fx.height = boardEl.offsetHeight + 16;
    fx.style.left='-8px'; fx.style.top='-8px';
  }

  /* -------- resize handle для размера кристаллов -------- */
  var boardWrap = document.getElementById('gBoardWrap');
  var resizeHandle = document.getElementById('gResizeHandle');
  var isResizing = false;
  var startX, startY, startSize;

  if(resizeHandle){
    resizeHandle.addEventListener('pointerdown', function(e){
      isResizing = true;
      startX = e.clientX;
      startY = e.clientY;
      startSize = currentCellSize;
      resizeHandle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    resizeHandle.addEventListener('pointermove', function(e){
      if(!isResizing) return;
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      // Диагональное движение: вправо-вниз = увеличить, влево-вверх = уменьшить
      var delta = (dx + dy) / 2;
      var newSize = Math.max(30, Math.min(160, startSize + Math.round(delta / 2)));
      if(newSize !== currentCellSize){
        currentCellSize = newSize;
        // Пересчитываем только размер сетки, фон не трогаем
        var cell = currentCellSize;
        boardEl.style.width = (cell*COLS)+'px';
        boardEl.style.height = (cell*ROWS)+'px';
        var hud = document.querySelector('.g-hud');
        if(hud) hud.style.maxWidth = (cell*COLS)+'px';
        fx.width = boardEl.offsetWidth + 16; fx.height = boardEl.offsetHeight + 16;
        drawBoard();
      }
    });
    resizeHandle.addEventListener('pointerup', function(e){
      isResizing = false;
      if(resizeHandle.releasePointerCapture) resizeHandle.releasePointerCapture(e.pointerId);
    });
  }
  function hexToRgb(hex){ hex=String(hex||'#888888').replace('#',''); if(hex.length===3) hex=hex.split('').map(function(c){return c+c;}).join(''); var num=parseInt(hex,16)||0x888888; return {r:(num>>16)&255,g:(num>>8)&255,b:num&255}; }
  function rgbToHex(r,g,b){ function h(v){ v=Math.max(0,Math.min(255,Math.round(v))); var s=v.toString(16); return s.length<2?'0'+s:s; } return '#'+h(r)+h(g)+h(b); }
  function shade(hex, percent){ var c=hexToRgb(hex); var t=percent<0?0:255; var p=Math.abs(percent)/100; return rgbToHex(c.r+(t-c.r)*p, c.g+(t-c.g)*p, c.b+(t-c.b)*p); }
  function rgbaC(hex, a){ var c=hexToRgb(hex); return 'rgba('+c.r+','+c.g+','+c.b+','+a+')'; }

  function facetSVG(base){
    var fTable = shade(base,42), fTopLeft = shade(base,16), fTopRight = shade(base,0),
        fRight = shade(base,-18), fLeftBottom = shade(base,-28), fBottom = shade(base,-44),
        edge = shade(base,-62);
    var P0='50,2', P1='97,37', P2='80,97', P3='20,97', P4='3,37';
    var I0='45,17', I1='66,33', I2='58,57', I3='33,57', I4='25,33';
    return ''+
    '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block;overflow:visible;">'+
      '<polygon points="'+P4+' '+P0+' '+I0+' '+I4+'" fill="'+fTopLeft+'"/>'+
      '<polygon points="'+P0+' '+P1+' '+I1+' '+I0+'" fill="'+fTopRight+'"/>'+
      '<polygon points="'+P1+' '+P2+' '+I2+' '+I1+'" fill="'+fRight+'"/>'+
      '<polygon points="'+P3+' '+P4+' '+I4+' '+I3+'" fill="'+fLeftBottom+'"/>'+
      '<polygon points="'+P2+' '+P3+' '+I3+' '+I2+'" fill="'+fBottom+'"/>'+
      '<polygon points="'+I0+' '+I1+' '+I2+' '+I3+' '+I4+'" fill="'+fTable+'"/>'+
      '<polygon points="'+P0+' '+P1+' '+P2+' '+P3+' '+P4+'" fill="none" stroke="'+edge+'" stroke-width="1.6" stroke-opacity=".55"/>'+
      '<polygon points="'+I0+' '+I1+' '+I2+' '+I3+' '+I4+'" fill="none" stroke="'+edge+'" stroke-width=".8" stroke-opacity=".4"/>'+
      '<line x1="30" y1="72" x2="54" y2="88" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".16"/>'+
      '<line x1="72" y1="55" x2="82" y2="80" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".1"/>'+
      '<ellipse cx="40" cy="27" rx="15" ry="9" fill="#fff" opacity=".55" transform="rotate(-18 40 27)"/>'+
      '<circle cx="32" cy="19" r="2.6" fill="#fff" opacity=".92"/>'+
    '</svg>';
  }

  function gemVisualHTML(gem, opts){
    opts = opts || {};
    var effSrc = gem.src || gem.templateSrc || null;
    var base = gem.color || '#E8B75B';
    var lighter = shade(base, 78);
    var withAura = (opts.aura!==false) && !effSrc;
    var withSpark = !!opts.spark && !effSrc;
    var body;
    if(effSrc){
      var mask = 'radial-gradient(circle at 50% 50%, #000 84%, rgba(0,0,0,.55) 93%, transparent 100%)';
      body = '<div style="position:absolute;inset:0;background-image:url(\\''+effSrc+'\\');background-size:cover;background-position:center;'+
        '-webkit-mask-image:'+mask+';mask-image:'+mask+';"></div>';
    } else {
      body = '<div style="position:absolute;inset:0;">'+facetSVG(base)+'</div>';
    }
    var html = '<div class="gem3d">';
    if(withAura) html += '<div class="g3-aura" style="background:radial-gradient(circle,'+rgbaC(base,.55)+' 0%, transparent 72%);"></div>';
    html += body;
    if(withSpark){
      html += '<div class="g3-spark s1" style="background:'+rgbaC(lighter,.95)+';"></div>';
      html += '<div class="g3-spark s2" style="background:'+rgbaC(lighter,.9)+';"></div>';
      html += '<div class="g3-spark s3" style="background:'+rgbaC(lighter,.85)+';"></div>';
    }
    html += '</div>';
    return html;
  }

  function randGem(){ return Math.floor(Math.random()*GEMS.length); }

  function initBoard(){
    board = [];
    for(var r=0;r<ROWS;r++){
      var row=[];
      for(var c=0;c<COLS;c++){
        var v;
        do{ v = randGem(); }
        while( (c>=2 && row[c-1]===v && row[c-2]===v) || (r>=2 && board[r-1][c]===v && board[r-2][c]===v) );
        row.push(v);
      }
      board.push(row);
    }
  }

  function cellEl(r,c){ return boardEl.children[r*COLS+c]; }

  function drawBoard(popSet){
    boardEl.innerHTML='';
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        var d = document.createElement('div');
        d.className='g-cell'+(popSet && popSet[r+'_'+c] ? ' pop':'');
        d.dataset.r=r; d.dataset.c=c;
        var shape=document.createElement('div');
        shape.className='g-gem-shape';
        var gv=board[r][c];
        if(gv!=null) shape.innerHTML = gemVisualHTML(GEMS[gv], {aura:false, spark:false});
        d.appendChild(shape);
        d.addEventListener('click', onCellClick);
        boardEl.appendChild(d);
      }
    }
  }

  function onCellClick(e){
    if(busy) return;
    var r=parseInt(this.dataset.r,10), c=parseInt(this.dataset.c,10);
    if(!selected){ selected={r:r,c:c}; this.classList.add('selected'); return; }
    if(selected.r===r && selected.c===c){ this.classList.remove('selected'); selected=null; return; }
    var dr=Math.abs(selected.r-r), dc=Math.abs(selected.c-c);
    if(dr+dc===1){
      var pr=selected.r, pc=selected.c;
      cellEl(pr,pc).classList.remove('selected');
      selected=null;
      trySwap(pr,pc,r,c);
    } else {
      cellEl(selected.r,selected.c).classList.remove('selected');
      selected={r:r,c:c};
      this.classList.add('selected');
    }
  }

  function swapVals(r1,c1,r2,c2){ var t=board[r1][c1]; board[r1][c1]=board[r2][c2]; board[r2][c2]=t; }

  function trySwap(r1,c1,r2,c2){
    busy=true;
    swapVals(r1,c1,r2,c2);
    var groups = findMatchGroups();
    if(groups.length===0){
      setTimeout(function(){ swapVals(r1,c1,r2,c2); drawBoard(); busy=false; }, 160);
      drawBoard();
      return;
    }
    drawBoard();
    processResolution(groups, true);
  }

  function findMatchGroups(){
    var matched = [];
    for(var r=0;r<ROWS;r++) matched.push(new Array(COLS).fill(false));
    for(var r=0;r<ROWS;r++){
      var runStart=0;
      for(var c=1;c<=COLS;c++){
        if(c<COLS && board[r][c]===board[r][runStart]) continue;
        if(c-runStart>=3){ for(var k=runStart;k<c;k++) matched[r][k]=true; }
        runStart=c;
      }
    }
    for(var c=0;c<COLS;c++){
      var runStart2=0;
      for(var r2=1;r2<=ROWS;r2++){
        if(r2<ROWS && board[r2][c]===board[runStart2][c]) continue;
        if(r2-runStart2>=3){ for(var k2=runStart2;k2<r2;k2++) matched[k2][c]=true; }
        runStart2=r2;
      }
    }
    var visited=[];
    for(var r3=0;r3<ROWS;r3++) visited.push(new Array(COLS).fill(false));
    var groups=[];
    for(var r4=0;r4<ROWS;r4++){
      for(var c4=0;c4<COLS;c4++){
        if(matched[r4][c4] && !visited[r4][c4]){
          var gv=board[r4][c4];
          var stack=[[r4,c4]]; var cells=[];
          visited[r4][c4]=true;
          while(stack.length){
            var cur=stack.pop(); cells.push(cur);
            var nbrs=[[cur[0]-1,cur[1]],[cur[0]+1,cur[1]],[cur[0],cur[1]-1],[cur[0],cur[1]+1]];
            for(var n=0;n<4;n++){
              var nr=nbrs[n][0], nc=nbrs[n][1];
              if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&matched[nr][nc]&&!visited[nr][nc]&&board[nr][nc]===gv){
                visited[nr][nc]=true; stack.push([nr,nc]);
              }
            }
          }
          groups.push({gem:gv, cells:cells});
        }
      }
    }
    return groups;
  }

  function centroidOf(cells){
    var rect = boardEl.getBoundingClientRect();
    var cw = rect.width/COLS, ch = rect.height/ROWS;
    var sx=0, sy=0;
    for(var i=0;i<cells.length;i++){ sx += cells[i][1]*cw+cw/2; sy += cells[i][0]*ch+ch/2; }
    return {x: sx/cells.length, y: sy/cells.length};
  }

  function removeCells(cells){
    for(var i=0;i<cells.length;i++){ board[cells[i][0]][cells[i][1]] = null; }
  }

  function collapseAndRefill(){
    var pop = {};
    for(var c=0;c<COLS;c++){
      var stack=[];
      for(var r=ROWS-1;r>=0;r--){ if(board[r][c]!=null) stack.push(board[r][c]); }
      var col=[];
      for(var r2=ROWS-1;r2>=0;r2--){
        if(stack.length){ col[r2]=stack.shift(); }
        else { col[r2]=randGem(); pop[r2+'_'+c]=true; }
      }
      for(var r3=0;r3<ROWS;r3++) board[r3][c]=col[r3];
    }
    return pop;
  }

  function updateProgress(){
    var pct = Math.min(100, Math.round(progress/target*100));
    document.getElementById('gProgFill').style.width = pct+'%';
    document.getElementById('gProgText').textContent = progress+' / '+target;
  }

  var wonAlready = false;
  var hitTargetToastShown = false;
  function checkWinCondition(){
    if(wonAlready) return true;
    if(progress>=target){
      if(allQuestionsAsked()){
        wonAlready = true;
        setTimeout(showWin, 350);
        return true;
      } else if(!hitTargetToastShown){
        hitTargetToastShown = true;
        gameToast(CONFIG.targetReachedMessage || 'Кристаллы собраны! Продолжай играть');
      }
    }
    return false;
  }

  function processResolution(groups, fromSwap){
    var addedProgress=0;
    var qGroups=[];
    for(var i=0;i<groups.length;i++){
      var g=groups[i];
      if(g.gem===targetIndex){
        addedProgress += g.cells.length;
        var ctr=centroidOf(g.cells);
        launchFx(CONFIG.feedback, ctr.x, ctr.y);
      } else if(fromSwap && CONFIG.questions.length>0 && qGroups.length===0){
        /* только ПЕРВАЯ несовпадающая группа порождает вопрос — остальные,
           даже если совпало сразу несколько рядов за один ход, убираются без доп. вопросов */
        qGroups.push(g);
      }
    }
    progress += addedProgress;
    updateProgress();
    var allCells=[];
    groups.forEach(function(g){
      if(qGroups.indexOf(g)===-1) g.cells.forEach(function(cc){ allCells.push(cc); });
    });
    removeCells(allCells);
    var pop = collapseAndRefill();
    drawBoard(pop);

    if(checkWinCondition()) return;

    if(qGroups.length>0){
      askQuestions(qGroups, function(){ afterMatchSettle(); });
    } else {
      afterMatchSettle();
    }
  }

  function askQuestions(qGroups, done){
    var idx=0;
    function next(){
      if(idx>=qGroups.length){
        if(checkWinCondition()) return;
        done();
        return;
      }
      var g = qGroups[idx]; idx++;
      var q = pickQuestion();
      showQuestion(q, function(correct){
        if(!correct){ target += CONFIG.wrongPenalty; updateProgress(); shakeHud(); }
        removeCells(g.cells);
        var pop = collapseAndRefill();
        drawBoard(pop);
        setTimeout(next, 260);
      });
    }
    next();
  }

  function pickQuestion(){
    var neverAsked = CONFIG.questions.filter(function(q){ return !askedIds[q.id]; });
    var pool = neverAsked.length>0 ? neverAsked : CONFIG.questions;
    var q = pool[Math.floor(Math.random()*pool.length)];
    askedIds[q.id] = true;
    return q;
  }

  function allQuestionsAsked(){
    return CONFIG.questions.length===0 || Object.keys(askedIds).length >= CONFIG.questions.length;
  }

  function shakeHud(){
    var t=document.getElementById('gProgText');
    t.style.color='#F08398';
    setTimeout(function(){ t.style.color=''; }, 700);
  }

  function gameToast(msg){
    var existing = document.getElementById('gToast');
    if(existing) existing.remove();
    var t = document.createElement('div');
    t.id = 'gToast';
    t.className = 'g-toast';
    t.textContent = msg;
    document.querySelector('.g-wrap').appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){
      t.classList.remove('show');
      setTimeout(function(){ if(t.parentNode) t.remove(); }, 300);
    }, 2200);
  }

  function afterMatchSettle(){
    var groups = findMatchGroups();
    if(groups.length>0){
      processResolution(groups, false);
    } else {
      busy=false;
    }
  }

  function showQuestion(q, onResolved){
    var modal = document.getElementById('gModal');
    var mc = CONFIG.modal || {style:'default', color:'#E8B75B', font:'system', fontSize:16, bgImage:null};
    var fontFamilies = {
      system:'-apple-system,BlinkMacSystemFont,\\'Segoe UI\\',Roboto,sans-serif',
      comfortaa:'\\'Comfortaa\\',cursive', nunito:'\\'Nunito\\',sans-serif',
      playfair:'\\'Playfair Display\\',serif', cormorant:'\\'Cormorant Garamond\\',serif',
      badscript:'\\'Bad Script\\',cursive', rampart:'\\'Rampart One\\',cursive'
    };
    var fontFam = fontFamilies[mc.font] || fontFamilies.system;
    var boxStyle = 'font-family:'+fontFam+';position:relative;overflow:hidden;--modal-accent:'+mc.color+';--modal-accent-dark:'+shade(mc.color,-25)+';--modal-max-width:'+(mc.maxWidth||420)+'px;';
    var headStyle = 'font-size:'+(mc.fontSize||16)+'px;position:relative;font-family:'+fontFam+';';
    if(mc.style==='3d'){
      boxStyle += 'background:linear-gradient(160deg,#2b2040,#1a1228);border:3px solid '+mc.color+';box-shadow:0 8px 0 '+shade(mc.color,-40)+',0 16px 26px rgba(0,0,0,.55);';
    } else if(mc.style==='neon'){
      boxStyle += 'background:#0d0a17;border:2px solid '+mc.color+';box-shadow:0 0 10px '+mc.color+',0 0 28px '+rgbaC(mc.color,.5)+',inset 0 0 20px '+rgbaC(mc.color,.12)+';';
    } else {
      boxStyle += 'background:#211732;border:1px solid #3a2e52;box-shadow:0 20px 60px rgba(0,0,0,.5);';
    }
    var bgLayer = mc.bgImage ? '<div style="position:absolute;inset:0;background-image:url(\\''+mc.bgImage+'\\');background-size:cover;background-position:center;opacity:.35;pointer-events:none;"></div>' : '';
    var html = '<div class="g-modal" style="'+boxStyle+'">'+bgLayer;
    html += '<h3 style="'+headStyle+'">'+escapeHtml(q.text)+'</h3>';
    if(q.image) html += '<img class="qimg" src="'+q.image+'">';

    if(q.type==='single' || q.type==='multiple'){
      html += '<div id="gOptWrap">';
      for(var i=0;i<q.options.length;i++){
        var o=q.options[i];
        html += '<div class="g-opt" data-i="'+i+'" data-type="'+q.type+'" style="font-size:'+(mc.fontSize||16)+'px;">' + (o.image?'<img src="'+o.image+'">':'') + '<span>'+escapeHtml(o.text)+'</span></div>';
      }
      html += '</div><button class="g-submit" id="gSubmit">Ответить</button>';
    } else if(q.type==='text'){
      html += '<input type="text" class="g-text-input" id="gTextInput" placeholder="Введите ответ">';
      html += '<button class="g-submit" id="gSubmit">Ответить</button>';
    } else if(q.type==='order'){
      var shuffled = q.items.slice();
      for(var s=shuffled.length-1;s>0;s--){ var j=Math.floor(Math.random()*(s+1)); var tmp=shuffled[s]; shuffled[s]=shuffled[j]; shuffled[j]=tmp; }
      html += '<div id="gOrderWrap">';
      for(var oi=0; oi<shuffled.length; oi++){
        var it = shuffled[oi];
        html += '<div class="g-order-row" data-id="'+it.id+'"><span class="drag-handle">&#10247;&#10247;</span>' + (it.image?'<img src="'+it.image+'">':'') + '<span>'+escapeHtml(it.text)+'</span></div>';
      }
      html += '</div><button class="g-submit" id="gSubmit">Ответить</button>';
    } else if(q.type==='info'){
      html += '<button class="g-submit" id="gSubmit">Понятно</button>';
    }
    html += '<div class="g-fb" id="gFb"></div></div>';
    modal.innerHTML = html;
    modal.style.display='flex';
    if(window.MathJax && MathJax.typesetPromise){
      if(MathJax.typesetClear) MathJax.typesetClear([modal]);
      MathJax.typesetPromise([modal]).catch(function(){});
    }

    var picked = {};
    if(q.type==='single' || q.type==='multiple'){
      var opts = modal.querySelectorAll('.g-opt');
      opts.forEach(function(el){
        el.addEventListener('click', function(){
          var i=this.dataset.i;
          if(q.type==='single'){ opts.forEach(function(o){o.classList.remove('picked');}); this.classList.add('picked'); picked={}; picked[i]=true; }
          else { this.classList.toggle('picked'); if(picked[i]) delete picked[i]; else picked[i]=true; }
        });
      });
    }
    if(q.type==='order'){
      var wrap = document.getElementById('gOrderWrap');
      var dragEl = null, startY = 0;
      function getRows(){ return Array.prototype.slice.call(wrap.children); }
      function onOrderMove(e){
        if(!dragEl) return;
        var deltaY = e.clientY - startY;
        dragEl.style.transform = 'translateY('+deltaY+'px)';
        var rows = getRows();
        var curIndex = rows.indexOf(dragEl);
        for(var i=0;i<rows.length;i++){
          if(rows[i]===dragEl) continue;
          var r = rows[i].getBoundingClientRect();
          var mid = r.top + r.height/2;
          if(i<curIndex && e.clientY<mid){ wrap.insertBefore(dragEl, rows[i]); dragEl.style.transform=''; startY = e.clientY; break; }
          if(i>curIndex && e.clientY>mid){ wrap.insertBefore(dragEl, rows[i].nextSibling); dragEl.style.transform=''; startY = e.clientY; break; }
        }
      }
      function onOrderUp(){
        if(!dragEl) return;
        dragEl.classList.remove('dragging');
        dragEl.style.transform = '';
        dragEl = null;
        document.removeEventListener('pointermove', onOrderMove);
        document.removeEventListener('pointerup', onOrderUp);
      }
      modal.querySelectorAll('.g-order-row .drag-handle').forEach(function(handle){
        handle.addEventListener('pointerdown', function(e){
          e.preventDefault();
          dragEl = handle.closest('.g-order-row');
          dragEl.classList.add('dragging');
          startY = e.clientY;
          document.addEventListener('pointermove', onOrderMove);
          document.addEventListener('pointerup', onOrderUp);
        });
      });
    }

    document.getElementById('gSubmit').addEventListener('click', function(){
      var correct=false;
      if(q.type==='info'){ correct=true; }
      else if(q.type==='single' || q.type==='multiple'){
        var chosenIdx = Object.keys(picked).map(Number);
        var correctIdx = []; for(var i2=0;i2<q.options.length;i2++) if(q.options[i2].correct) correctIdx.push(i2);
        correct = chosenIdx.length===correctIdx.length && chosenIdx.every(function(x){return correctIdx.indexOf(x)!==-1;});
      } else if(q.type==='text'){
        var val = (document.getElementById('gTextInput').value||'').trim().toLowerCase();
        var accepted = (q.answers||'').split('|').map(function(s){return s.trim().toLowerCase();}).filter(Boolean);
        correct = accepted.indexOf(val)!==-1;
      } else if(q.type==='order'){
        var rows = modal.querySelectorAll('.g-order-row');
        var seq = Array.prototype.map.call(rows, function(r){return r.dataset.id;});
        var correctSeq = q.items.map(function(it){return it.id;});
        correct = seq.length===correctSeq.length && seq.every(function(id,idx){return id===correctSeq[idx];});
      }
      var fb = document.getElementById('gFb');
      fb.textContent = correct? 'Верно!' : 'Неверно, попробуем собрать ещё кристаллов';
      fb.className = 'g-fb '+(correct?'ok':'bad');
      document.getElementById('gSubmit').disabled=true;
      setTimeout(function(){ modal.style.display='none'; onResolved(correct); }, 1100);
    });
  }

  function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* -------- частицы (конфетти / фейерверк / салют звёзд) -------- */
  var particles=[];
  var fxColors = GEMS.map(function(g){ return g.color; });
  function launchFx(type, x, y){
    var n = type==='fireworks'?46:type==='stars'?34:40;
    for(var i=0;i<n;i++){
      var ang = Math.random()*Math.PI*2;
      var speed = type==='fireworks' ? (2+Math.random()*4) : (1.5+Math.random()*3);
      particles.push({
        x:x, y:y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed - (type==='confetti'?2:0),
        life:0, maxLife: type==='confetti'?70:56,
        color: fxColors[Math.floor(Math.random()*fxColors.length)],
        rot: Math.random()*Math.PI, rv:(Math.random()-0.5)*0.3,
        size: 4+Math.random()*4, type:type
      });
    }
    if(!particles._raf){ particles._raf=true; requestAnimationFrame(tickFx); }
  }
  function tickFx(){
    fxCtx.clearRect(0,0,fx.width,fx.height);
    var alive=false;
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i]; p.life++;
      if(p.life>p.maxLife){ particles.splice(i,1); continue; }
      alive=true;
      var t = p.life/p.maxLife;
      p.x += p.vx; p.y += p.vy; p.rot += p.rv;
      if(p.type==='confetti') p.vy += 0.10;
      else { p.vx*=0.96; p.vy*=0.96; }
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, 1-t);
      fxCtx.translate(p.x+8, p.y+8);
      fxCtx.rotate(p.rot);
      fxCtx.fillStyle = p.color;
      if(p.type==='confetti'){ fxCtx.fillRect(-p.size/2,-p.size/3,p.size,p.size*0.66); }
      else if(p.type==='stars'){
        fxCtx.beginPath();
        for(var s=0;s<5;s++){
          var a1 = s*(Math.PI*2/5) - Math.PI/2;
          var a2 = a1 + Math.PI/5;
          fxCtx.lineTo(Math.cos(a1)*p.size, Math.sin(a1)*p.size);
          fxCtx.lineTo(Math.cos(a2)*p.size*0.42, Math.sin(a2)*p.size*0.42);
        }
        fxCtx.closePath(); fxCtx.fill();
      } else {
        fxCtx.beginPath(); fxCtx.arc(0,0,p.size*0.6,0,Math.PI*2); fxCtx.fill();
      }
      fxCtx.restore();
    }
    if(alive) requestAnimationFrame(tickFx); else particles._raf=false;
  }

  function showWin(){
    var win = document.createElement('div');
    win.className='g-win';
    win.innerHTML = '<h2>Сокровища найдены!</h2><p>Собрано '+progress+' кристаллов из '+target+'.</p><button id="gAgain">Играть заново</button>';
    document.body.appendChild(win);
    launchFx('fireworks', fx.width/2, fx.height/2);
    launchFx('confetti', fx.width/2, 20);
    document.getElementById('gAgain').addEventListener('click', function(){ location.reload(); });
  }

  sizeBoard();
  initBoard();
  drawBoard();
  updateProgress();
  // window.addEventListener('resize', sizeBoard); // Отключено: resize handle управляет размером вручную
})();
`;

function buildStandaloneHTML(config){
  const cfg = JSON.parse(JSON.stringify(config));
  let json = JSON.stringify(cfg).replace(/<\/script/gi, '<\\/script');
  const fontDef = FONT_OPTIONS.find(f=>f.id===(config.modal&&config.modal.font));
  const fontLink = (fontDef && fontDef.google) ?
    '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
    '<link href="https://fonts.googleapis.com/css2?family='+fontDef.google+'&display=swap" rel="stylesheet">' : '';
  let html = '<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">' +
    fontLink +
    '<script>window.MathJax={tex:{inlineMath:[["$","$"],["\\\\(","\\\\)"]],displayMath:[["$$","$$"],["\\\\[","\\\\]"]]},options:{skipHtmlTags:["script","noscript","style","textarea","pre"]}};</' + 'script>' +
    '<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></' + 'script>' +
    '<title>Сокровища пустыни</title><style>' + GAME_CSS + '</style></head>' +
    '<body><div id="game-root"></div><script>' +
    'var CONFIG = ' + json + ';\n' + GAME_ENGINE_JS +
    '</' + 'script></body></html>';
  return html;
}

document.getElementById('panelRoot').addEventListener('change', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const act = el.dataset.action;
  const qi = el.dataset.q!==undefined ? parseInt(el.dataset.q,10) : null;
  const oi = el.dataset.o!==undefined ? parseInt(el.dataset.o,10) : null;

  if(act==='set-rows'){ state.grid.rows=Math.max(5,Math.min(10,parseInt(el.value,10)||8)); render(); }
  else if(act==='set-cols'){ state.grid.cols=Math.max(5,Math.min(10,parseInt(el.value,10)||8)); render(); }
  else if(act==='set-target-gem'){ state.targetGemId=el.value; render(); }
  else if(act==='set-target-count'){ state.targetCount=Math.max(1,parseInt(el.value,10)||15); render(); }
  else if(act==='set-penalty'){ state.wrongPenalty=Math.max(0,parseInt(el.value,10)||0); render(); }
  else if(act==='set-feedback'){ state.feedback=el.value; render(); }
  else if(act==='set-modal-color'){ state.modal.color=el.value; render(); }
  else if(act==='set-modal-font'){ state.modal.font=el.value; render(); }
  else if(act==='gem-toggle'){
    const i=parseInt(el.dataset.i,10);
    const enabledCount = state.gems.filter(g=>g.enabled).length;
    if(!el.checked && enabledCount<=4){ el.checked=true; showToast('Минимум 4 кристалла должны быть включены'); return; }
    state.gems[i].enabled = el.checked;
    if(!state.gems[i].enabled && state.targetGemId===state.gems[i].id){
      const next = state.gems.find(g=>g.enabled);
      if(next) state.targetGemId = next.id;
    }
    render();
  }
  /* q-text/q-answers/opt-text/item-text/opt-correct уже синхронизированы через 'input'/'click' —
     здесь их намеренно не трогаем, чтобы не пересоздавать DOM и не терять фокус/клик */
});

    {code:'x_{i}', desc:'Индекс'},
