let lastLatexField = null;
document.addEventListener('focusin', function(e){
  const el = e.target;
  if(el && el.dataset && (el.dataset.action==='q-text' || el.dataset.action==='opt-text' || el.dataset.action==='q-answers' || el.dataset.action==='item-text')){
    lastLatexField = el;
  }
});

function insertAtCursor(field, text){
  if(!field){ showToast('Сначала кликните в поле текста вопроса или ответа'); return; }
  const start = field.selectionStart!=null ? field.selectionStart : field.value.length;
  const end = field.selectionEnd!=null ? field.selectionEnd : field.value.length;
  const before = field.value.slice(0,start), after = field.value.slice(end);
  field.value = before + text + after;
  field.dispatchEvent(new Event('input', {bubbles:true}));
  field.focus();
  const pos = start + text.length;
  try{ field.setSelectionRange(pos,pos); }catch(e){}
  showToast('Формула вставлена');
}

function renderLatexCards(){
  const scroll = document.getElementById('latexCardScroll');
  if(!scroll) return;
  let html = '';
  LATEX_SNIPPETS.forEach(function(sec){
    html += '<div class="latex-section-title">'+sec.group+'</div><div class="latex-grid">';
    sec.items.forEach(function(it){
      html += '<div class="latex-card" data-latex-code="'+escAttr(it.code)+'">'+
        '<div class="latex-card-render">$'+escHtml(it.code)+'$</div>'+
        '<div class="latex-card-desc">'+it.desc+'</div>'+
      '</div>';
    });
    html += '</div>';
  });
  scroll.innerHTML = html;
  scroll.querySelectorAll('.latex-card').forEach(function(card){
    card.addEventListener('click', function(){
      insertAtCursor(lastLatexField, '$'+card.dataset.latexCode+'$');
    });
  });
  typesetMath(scroll);
}

function typesetMath(el){
  if(window.MathJax && MathJax.typesetPromise){
    if(MathJax.typesetClear) MathJax.typesetClear([el]);
    MathJax.typesetPromise([el]).catch(function(){});
  }
}

document.getElementById('latexToggleBtn').addEventListener('click', function(){
  document.getElementById('latexPanel').classList.add('open');
  renderLatexCards();
});
document.getElementById('latexPanelClose').addEventListener('click', function(){
  document.getElementById('latexPanel').classList.remove('open');
});
const latexComposeInput = document.getElementById('latexComposeInput');
const latexComposePreview = document.getElementById('latexComposePreview');
const latexInsertBtn = document.getElementById('latexInsertBtn');
latexComposeInput.addEventListener('input', function(){
  const v = latexComposeInput.value.trim();
  latexInsertBtn.disabled = !v;
  latexComposePreview.innerHTML = v ? '$'+escHtml(v)+'$' : '';
  typesetMath(latexComposePreview);
});
latexInsertBtn.addEventListener('click', function(){
  const v = latexComposeInput.value.trim();
  if(!v) return;
  insertAtCursor(lastLatexField, '$'+v+'$');
});

/* Живой предпросмотр LaTeX под текстом вопроса */
document.getElementById('panelRoot').addEventListener('input', function(e){
  const el = e.target.closest('[data-action="q-text"]');
  if(!el) return;
  const qi = el.dataset.q;
  const prev = document.getElementById('qLatexPreview_'+qi);
  if(prev){
    prev.innerHTML = el.value ? el.value.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
    typesetMath(prev);
  }
});

document.getElementById('saveFileBtn').addEventListener('click', function(){
  const data = serializeStateForSave();
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'проект-игры.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  showToast('Проект сохранён в файл');
});

document.getElementById('loadFileBtn').addEventListener('click', function(){
  document.getElementById('loadFileInput').click();
});
document.getElementById('loadFileInput').addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const saved = JSON.parse(reader.result);
      restoreFromSaved(saved);
      render();
      showToast('Проект загружен из файла');
    }catch(e){
      showToast('Не удалось загрузить файл — проверьте, что это файл проекта');
    }
  };
  reader.readAsText(file);
  this.value = '';
});

tryRestoreOnLoad();
render();
</script>
